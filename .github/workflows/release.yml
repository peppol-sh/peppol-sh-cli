# Runs at the root of the public mirror repo (peppol-sh/peppol-sh-cli).
# Releases happen here, tag-triggered, so they are auditable where the
# community looks (ADR-0022). The monorepo mirror workflow pushes the
# `vX.Y.Z` tag when internal/version/version.go has a version with a dated
# CHANGELOG.md heading.
#
# GoReleaser (.goreleaser.yaml) builds 6 binaries, uploads the archives,
# checksums.txt and SBOMs to the GitHub Release, and pushes the cask to
# peppol-sh/homebrew-tap. The macOS binaries are not signed or notarized
# (ADR-0030, amendment). This workflow then attests the provenance of every
# archive.
#
# One-time setup (a human does this, once; details in
# docs/runbooks/cli-release.md of the monorepo): create the repos
# peppol-sh/peppol-sh-cli and peppol-sh/homebrew-tap, and add this Actions
# secret to peppol-sh/peppol-sh-cli:
#   HOMEBREW_TAP_TOKEN       fine-grained PAT, contents:write on peppol-sh/homebrew-tap
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release and its assets
  id-token: write # Sigstore certificate for the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the previous tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A tag that disagrees with the code would ship a binary that reports
      # another version. The ldflags set the version from the tag, so check it
      # here, before the Release exists.
      - name: Check that the tag matches version.Version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          code_version="$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' internal/version/version.go)"
          if [ "$tag_version" != "$code_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.Version ($code_version) in internal/version/version.go"
            exit 1
          fi

      # Every release is in the tap. Without this check, GoReleaser fails only
      # after the GitHub Release exists.
      - name: Check that the release secret is set
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Missing repository secret: HOMEBREW_TAP_TOKEN"
            exit 1
          fi
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Test
        run: go test ./...

      # GoReleaser runs syft for the SBOM of each archive.
      - uses: anchore/sbom-action/download-syft@v0.24.3

      # The notes file goes to $RUNNER_TEMP: an untracked file in the checkout
      # makes GoReleaser stop with "git is in a dirty state".
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          escaped="${version//./\\.}"
          heading="$(grep -E "^## \[$escaped\]" CHANGELOG.md | head -n 1 || true)"
          if ! printf '%s\n' "$heading" | grep -Eq "^## \[$escaped\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$"; then
            echo "::error::CHANGELOG.md has no dated heading '## [$version] - YYYY-MM-DD' (found '$heading')"
            exit 1
          fi
          # The lines after the heading, up to the next version heading or the
          # link references at the end of the file.
          awk -v h="$heading" '
            $0 == h { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::The CHANGELOG.md section of $version is empty"
            exit 1
          fi
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned: a new GoReleaser can deprecate or change a key between two
          # releases. Raise it together with the monorepo CI (test-cli).
          version: v2.18.3
          args: release --clean --release-notes ${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # `gh attestation verify <archive> --repo peppol-sh/peppol-sh-cli`
      # checks an archive against this attestation.
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
